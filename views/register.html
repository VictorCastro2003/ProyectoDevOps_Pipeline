<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Registro</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <h2>Registro</h2>
  <form action="/auth/register" method="POST">
    <input name="username" placeholder="Usuario" required><br>
    <input name="password" type="password" placeholder="Contraseña" required><br>
    <button type="submit">Registrarse</button>
  </form>
  <p><a href="/login">Ir a login</a></p>
</body>
</html>
