<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Login</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <h2>Iniciar Sesión</h2>
  <form action="/auth/login" method="POST">
    <input name="username" placeholder="Usuario" required><br>
    <input name="password" type="password" placeholder="Contraseña" required><br>
    <button type="submit">Entrar</button>
  </form>
  <p><a href="/register">Crear cuenta</a></p>
</body>
</html>
